# Hält das kostenlose Supabase-Projekt aktiv (sonst Pause nach 7 Tagen ohne Nutzung).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Datenbank anpingen
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' config.js)
          KEY=$(sed -n 's/.*supabaseKey: *"\([^"]*\)".*/\1/p' config.js)
          curl -sS --fail -X POST "$URL/rest/v1/rpc/quiz_ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo

      - name: Repository aktiv halten
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $(( (NOW - LAST) / 86400 )) -ge 30 ]; then
            date -u +"%Y-%m-%dT%H:%MZ" > .github/keepalive.txt
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "keep-alive"
            git push
          fi
